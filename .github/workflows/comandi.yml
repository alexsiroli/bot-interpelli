name: Comandi in chat

on:
  schedule:
    # Ogni 5 minuti, che e' il minimo consentito da GitHub.
    # Sul repository pubblico i minuti di Actions sono illimitati, quindi la frequenza
    # non costa nulla. Serve fitta perche' GitHub esegue i job schedulati "best effort":
    # sotto carico li ritarda o li salta, e con uno slot ogni 5 minuti basta che ne passi
    # uno qualsiasi perche' il comando venga servito in fretta.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: comandi-chat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rispondi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Esegui i comandi arrivati in chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m interpelli.main --comandi

      - name: Committa lo stato aggiornato
        if: always()
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "Nessun comando ricevuto, stato invariato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore(stato): comandi elaborati [skip ci]"
          # I due workflow schedulati possono scrivere lo stato quasi in contemporanea.
          # Se il riallineamento non riesce non si fa fallire il run: lo stato verra'
          # ripreso al giro successivo, che e' sempre pochi minuti dopo.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::riallineamento fallito, stato non spinto: ci riprova il prossimo run"
            exit 0
          fi
          git push || echo "::warning::push fallito, ci riprova il prossimo run"
