name: Controllo interpelli

on:
  schedule:
    # Ogni ora, ai minuti 10 (gli slot all'ora esatta sono i piu' congestionati e quindi
    # i piu' ritardati da GitHub). Il cron e' in UTC, ma qui non importa: girando ogni ora
    # c'e' sempre un run poco dopo le 13:00 italiane, sia con l'ora legale sia con quella
    # solare, ed e' li' che parte il digest (config.yaml: ora_digest).
    # GitHub esegue i job schedulati "best effort" e ogni tanto ne salta qualcuno: con un
    # run ogni ora un buco si richiude da solo, e il digest parte al primo run utile.
    - cron: "10 * * * *"
  workflow_dispatch:

# Un run alla volta per questo workflow. Gruppo SEPARATO da quello dei comandi: con un
# gruppo condiviso, un run dei comandi (uno ogni 5 minuti) cancellerebbe il controllo
# rimasto in coda, che e' esattamente la cosa da non perdere.
concurrency:
  group: controllo-interpelli
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Se e' configurato un PAT (secret STATE_PUSH_TOKEN) si usa quello: i commit
          # fatti con GITHUB_TOKEN non contano come attivita' del repository, e dopo
          # 60 giorni GitHub disattiva i workflow schedulati. Vedi README.
          token: ${{ secrets.STATE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Cerca nuovi interpelli e manda gli avvisi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m interpelli.main --check

      - name: Committa lo stato aggiornato
        # always(): anche se un invio e' fallito, lo stato salvato va conservato.
        if: always()
        run: |
          if git diff --quiet -- state/seen.json; then
            echo "Nessuna modifica allo stato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore(stato): aggiorna gli interpelli gia' visti [skip ci]"
          # I due workflow schedulati possono scrivere lo stato quasi in contemporanea.
          # Se il riallineamento non riesce non si fa fallire il run: lo stato verra'
          # ripreso al giro successivo, che e' sempre pochi minuti dopo.
          if ! git pull --rebase --autostash origin main; then
            git rebase --abort || true
            echo "::warning::riallineamento fallito, stato non spinto: ci riprova il prossimo run"
            exit 0
          fi
          git push || echo "::warning::push fallito, ci riprova il prossimo run"
